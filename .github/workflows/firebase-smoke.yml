name: firebase-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      E2E_FIREBASE_SMOKE: true
      E2E_FIREBASE_GUEST_SMOKE: ${{ vars.E2E_FIREBASE_GUEST_SMOKE || 'false' }}
      E2E_FIREBASE_EMAIL: ${{ secrets.E2E_FIREBASE_EMAIL }}
      E2E_FIREBASE_PASSWORD: ${{ secrets.E2E_FIREBASE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Firebase auth E2E smoke
        run: npm run test:e2e:firebase
